        <title>Countries</title>
        <link rel="stylesheet" href="style.css" />
        <link
            href="https://fonts.googleapis.com/css?family=Nunito+Sans:300,regular,600,800"
            rel="stylesheet"
        />
        <script
            type="module"

        ></script>
        <script
            nomodule

        ></script>
        <script src="script.js" defer></script>

    <body>
        <header class="header-container">
            <div class="header-content">
                <a href="/">
                  <h1 class="title">Where in the World?</h1>
                </a>
                <button type="button" class="light-dark-mode-btn">
                    <ion-icon name="moon-outline"></ion-icon>&nbsp;Dark Mode
                </button>
            </div>
        </header>
        <section class="search-filter-country">
            <search class="search-country">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    height="24px"
                    viewBox="0 -960 960 960"
                    width="24px"
                    fill="#hsl(0, 0%, 50%)"
                >
                    <path
                        d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"
                    />
                </svg>
                <input
                    type="text"
                    name="search-country"
                    id="search-country"
                    placeholder="Search for a country..."
                />
            </search>
            <select name="country-region-filter" id="country-region-filter" class="filter-by-region">
                <option value="" hidden selected>Filter by Region</option>
                <option>Africa</option>
                <option>America</option>
                <option>Asia</option>
                <option>Europe</option>
                <option>Oceania</option>
            </select>
        </section>

        <main>
            <div class="countries-container">

          </div>
        </a>-->

    </body>
