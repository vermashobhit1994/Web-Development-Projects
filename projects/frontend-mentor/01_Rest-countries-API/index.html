<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countries</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito+Sans:300,regular,600,800"
      rel="stylesheet"
    />
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="header-container">
      <div class="header-content">
        <h1 class="title">Where in the World?</h1>
        <button type="button" class="light-dark-mode-btn">
          <ion-icon name="moon-outline"></ion-icon>&nbsp;Dark Mode
        </button>
      </div>
    </header>
    <main>
      <div class="countries-container">
        <a href="#" class="country-card">
          <div class="img-container">
            <img src="https://flagcdn.com/de.svg" alt="Germany flag">  
          </div>
          <!-- <img src="https://flagcdn.com/de.svg" alt="Germany flag"> -->
          <div class="card-text">
            <h2 class="card-title">Germany</h2>
            <p><b>Population: </b>81,770,900</p>
            <p><b>Region: </b>Europe</p>
            <p><b>Capital: </b>Berlin</p>
          </div>
        </a>
      </div>
    </main>
  </body>
</html>
