<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | NFT preview card component</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">


</head>

<body>

  <main>
    <div class="card-container">
      <div class="card">
        <div class="card__img-container">
          <img class="card__img" src="./images/image-equilibrium.jpg" alt="">

        </div>

        <div class="card__content">
          <h1 class="card__title">Equilibrium #3429</h1>
          <p class="card__description">Our Equilibrium collection promotes balance and calm.
          </p>
          <div class="card__ethereum-container">

            <div class="card__ethereum-details">
              <img class="card__ethereum-logo" src="./images/icon-ethereum.svg" alt="">
              <p class="card__ethereum-current-value">0.041 ETH</p>
            </div>

            <div class="card__ethereum-duration">
              <img src="./images/icon-clock.svg" alt="">
              <p>3 days left</p>
            </div>


          </div>

          <div class="line-break"></div>

          <div class="card__creator-container">
            <img src="./images/image-avatar.png" alt="image creator">
            <p class="card__creator-text">
              <span>Creation of</span>
              <span> Jules Wyvern</span>
            </p>
          </div>


        </div>


      </div>
    </div>
  </main>








</body>

</html>
